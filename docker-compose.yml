services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minibnb
      POSTGRES_PASSWORD: minibnb
      POSTGRES_DB: minibnb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibnb -d minibnb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
