[databases]
minibnb = host=postgres port=5432 dbname=minibnb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
admin_users = minibnb
max_prepared_statements = 200
